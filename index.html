<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>스터디 활동 기록</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 850px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #0001;
    }

    h1 {
      color: #253858;
    }

    h2 {
      margin-top: 35px;
      color: #253858;
    }

    .notice {
      margin-top: 12px;
      color: #666;
      font-size: 13px;
      line-height: 1.6;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      margin-top: 20px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: left;
      white-space: pre-wrap;
    }

    th {
      background: #eef2ff;
    }

    a {
      color: #2563eb;
    }

    .status {
      margin-top: 15px;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📚 스터디 활동 기록</h1>

  <p>
    스터디 참여 현황과 활동 내용을
    공유하는 페이지입니다.
  </p>

  <p class="notice">
    활동 기록은 GitHub 저장소에서 관리됩니다.
    관리자가 내용을 수정하면 모든 사용자가
    최신 기록을 확인할 수 있습니다.
  </p>

  <!-- 최신 기록 불러오기 -->
  <button type="button" onclick="loadRecords()">
    🔄 최신 기록 불러오기
  </button>

  <p id="status" class="status"></p>

  <!-- 활동 기록 목록 -->
  <h2>📋 스터디 활동 기록 목록</h2>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th>날짜</th>
          <th>참여 인원</th>
          <th>활동 내용</th>
          <th>보고서</th>
        </tr>
      </thead>

      <tbody id="records"></tbody>

    </table>

  </div>

  <p class="notice">
    보고서 파일은 GitHub 저장소의
    Report 폴더에서 관리됩니다.
  </p>

</div>

<script>

  // ====================================
  // 1. GitHub 공유 데이터 경로
  // ====================================

  const DATA_URL = "./activities.json";

  let records = [];


  // ====================================
  // 2. GitHub 최신 기록 불러오기
  // ====================================

  async function loadRecords() {

    const status =
      document.getElementById("status");

    status.textContent = "기록을 불러오는 중입니다.";

    try {

      // 브라우저 캐시 방지
      const url =
        DATA_URL + "?t=" + Date.now();

      const response = await fetch(url, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(
          "HTTP 오류: " + response.status
        );
      }

      const data = await response.json();

      if (!Array.isArray(data)) {
        throw new Error(
          "활동 기록 데이터 형식이 올바르지 않습니다."
        );
      }

      records = data;

      renderRecords();

      status.textContent =
        "최신 기록을 불러왔습니다. (" +
        records.length +
        "건)";

    } catch (error) {

      console.error(
        "활동 기록 불러오기 실패:",
        error
      );

      status.textContent =
        "기록을 불러오지 못했습니다. " +
        "activities.json 파일과 배포 상태를 확인하세요.";

    }
  }


  // ====================================
  // 3. 활동 기록 화면 출력
  // ====================================

  function renderRecords() {

    const tbody =
      document.getElementById("records");

    tbody.replaceChildren();

    // 기록이 없는 경우
    if (records.length === 0) {

      const row =
        document.createElement("tr");

      const cell =
        document.createElement("td");

      cell.colSpan = 4;

      cell.textContent =
        "등록된 스터디 활동 기록이 없습니다.";

      row.appendChild(cell);

      tbody.appendChild(row);

      return;
    }


    // 활동 기록 반복 출력
    records.forEach(record => {

      const row =
        document.createElement("tr");


      // 날짜
      const dateCell =
        document.createElement("td");

      dateCell.textContent =
        record.date ?? "";

      row.appendChild(dateCell);


      // 참여 인원
      const peopleCell =
        document.createElement("td");

      peopleCell.textContent =
        record.people ?? "";

      row.appendChild(peopleCell);


      // 활동 내용
      const contentCell =
        document.createElement("td");

      contentCell.textContent =
        record.content ?? "";

      row.appendChild(contentCell);


      // 보고서
      const reportCell =
        document.createElement("td");

      if (record.reportUrl) {

        try {

          const url = new URL(
            record.reportUrl,
            window.location.href
          );

          if (
            url.protocol === "https:" ||
            url.protocol === "http:"
          ) {

            const link =
              document.createElement("a");

            link.href = url.href;

            link.textContent =
              record.reportName || "보고서 보기";

            link.target = "_blank";

            link.rel =
              "noopener noreferrer";

            reportCell.appendChild(link);

          } else {

            reportCell.textContent =
              "지원하지 않는 링크";

          }

        } catch (error) {

          reportCell.textContent =
            "유효하지 않은 링크";

        }

      } else {

        reportCell.textContent = "-";

      }

      row.appendChild(reportCell);

      tbody.appendChild(row);

    });
  }


  // ====================================
  // 4. 페이지 접속 시 자동 불러오기
  // ====================================

  document.addEventListener(
    "DOMContentLoaded",
    loadRecords
  );

</script>

</body>
</html>
